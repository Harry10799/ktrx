name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve modules and generate checksums
        run: go mod tidy
      - name: Format Go sources
        run: gofmt -w $(git ls-files '*.go')
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: make build
      - name: Preserve generated dependency and formatting files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-validation-output
          path: |
            go.sum
          if-no-files-found: ignore
